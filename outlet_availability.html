<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bethancourt Ballroom Outlet Availability | TAMU Datathon</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #0b070a;
      --card-bg: rgba(26, 15, 22, 0.85);
      --maroon-accent: #500000;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --color-available: #10b981; /* Green */
      --color-unavailable: #ef4444; /* Red */
      --color-unpluggable: #18181b; /* Black */
      --border-unpluggable: #3f3f46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(80, 0, 0, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 10, 14, 0.95) 0%, #050304 100%);
      color: #f3f4f6;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      background: rgba(15, 10, 14, 0.9);
      border-bottom: 2px solid var(--gold);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title i {
      color: var(--gold);
      font-size: 1.8rem;
    }

    .brand-title h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    /* Top Right Clock Section */
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .admin-btn {
      background: linear-gradient(135deg, var(--gold), #b8860b);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .admin-btn:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .admin-btn.logged-in {
      background: #dc2626;
      color: #fff;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.4);
    }

    .clock-display {
      text-align: right;
    }

    .clock-date {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .clock-time {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.2;
    }

    .clock-updated {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .clock-updated span {
      color: #d1d5db;
      font-weight: 600;
    }

    /* Main Container & Grid Layout */
    .container {
      max-width: 1700px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .ballroom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    /* Table Pair Cards */
    .table-pair-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .table-pair-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .table-pair-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 0.5rem;
      text-align: center;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.3rem;
      letter-spacing: 0.5px;
    }

    .table-half {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.4rem 0;
    }

    .table-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
      margin: 0.25rem 0;
    }

    .table-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 0.4rem;
    }

    /* 4x4 Grid representation */
    .outlet-grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 130px;
      aspect-ratio: 1;
      padding: 4px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .outlet-cell {
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      position: relative;
      aspect-ratio: 1;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
    }

    .outlet-cell:hover {
      transform: scale(1.15);
      z-index: 2;
    }

    .outlet-cell.available {
      background-color: var(--color-available);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
    }

    .outlet-cell.unavailable {
      background-color: var(--color-unavailable);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
    }

    .outlet-cell.unpluggable {
      background-color: var(--color-unpluggable);
      border: 1px solid var(--border-unpluggable);
      cursor: not-allowed;
    }

    .outlet-cell.unpluggable.admin-editable {
      cursor: pointer;
    }

    .outlet-cell.unpluggable::after {
      content: "⚡";
      font-size: 8px;
      color: #ef4444;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.8;
    }

    /* Fixed Bottom Left Legend */
    .legend-box {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      background: rgba(15, 10, 14, 0.95);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .legend-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .legend-items {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #d1d5db;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .legend-color.available { background: var(--color-available); }
    .legend-color.unavailable { background: var(--color-unavailable); }
    .legend-color.unpluggable { 
      background: var(--color-unpluggable); 
      border: 1px solid var(--border-unpluggable);
    }

    /* Admin Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #140d12;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .modal-card h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      margin-bottom: 1.25rem;
      text-align: center;
      font-size: 1.3rem;
    }

    .modal-field {
      margin-bottom: 1rem;
    }

    .modal-field label {
      display: block;
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .modal-field input {
      width: 100%;
      background: #090507;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .modal-error {
      color: #ef4444;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.6rem;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .modal-btn-submit {
      background: var(--gold);
      color: #000;
    }

    .modal-btn-submit:hover {
      background: var(--gold-hover);
    }

    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
    }

    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-title">
      <i class="fa-solid fa-dice"></i>
      <div>
        <h1>Bethancourt Ballroom</h1>
        <p>Memorial Student Center • Texas A&M University</p>
      </div>
    </div>

    <div class="header-right">
      <button class="admin-btn" id="adminBtn" onclick="handleAdminToggle()">
        <i class="fa-solid fa-lock"></i> <span id="adminBtnText">Admin Login</span>
      </button>

      <div class="clock-display">
        <div class="clock-date" id="clockDate">November 8</div>
        <div class="clock-time" id="clockTime">4:40 AM</div>
        <div class="clock-updated">Last time updated: <span id="lastUpdated">November 8 | 4:26 AM</span></div>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <main class="container">
    <div class="ballroom-grid" id="ballroomGrid"></div>
  </main>

  <!-- Legend (Bottom Left) -->
  <div class="legend-box">
    <div class="legend-title"><i class="fa-solid fa-plug"></i> Outlet Status Legend</div>
    <div class="legend-items">
      <div class="legend-item">
        <div class="legend-color available"></div>
        <span>Available</span>
      </div>
      <div class="legend-item">
        <div class="legend-color unavailable"></div>
        <span>Unavailable</span>
      </div>
      <div class="legend-item">
        <div class="legend-color unpluggable"></div>
        <span>Unpluggable (Power Supply)</span>
      </div>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-card">
      <h2><i class="fa-solid fa-shield-halved"></i> Admin Login</h2>
      <div class="modal-error" id="modalError">Invalid Credentials! Please try again.</div>
      <form onsubmit="submitAdminLogin(event)">
        <div class="modal-field">
          <label for="adminName">Name</label>
          <input type="text" id="adminName" placeholder="Enter name..." required autocomplete="off" />
        </div>
        <div class="modal-field">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password..." required />
        </div>
        <div class="modal-field">
          <label for="adminId">ID Number</label>
          <input type="text" id="adminId" placeholder="Enter ID number..." required autocomplete="off" />
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn-cancel" onclick="closeAdminModal()">Cancel</button>
          <button type="submit" class="modal-btn modal-btn-submit">Authenticate</button>
        </div>
      </form>
    </div>
  </div>

    // Initialize full 16 (4x4) outlet grid state for each table
    function initializeOutletState() {
      const saved = localStorage.getItem('tamu_outlet_state');
      if (saved) {
        outletState = JSON.parse(saved);
        return;
      }

      tablePairs.forEach(pair => {
        pair.forEach(tableName => {
          const sheetStatus = sheetInitialData[tableName] || ["available", "available"];
          const grid = [];
          // 4x4 = 16 outlets per table grid representation
          for (let i = 0; i < 16; i++) {
            // Assign statuses proportionally based on spreadsheet values
            if (i < 8) {
              grid.push(sheetStatus[0]);
            } else {
              grid.push(sheetStatus[1]);
            }
          }
          outletState[tableName] = grid;
        });
      });
      saveOutletState();
    }

    function saveOutletState() {
      localStorage.setItem('tamu_outlet_state', JSON.stringify(outletState));
      updateLastUpdatedTimestamp();
    }

    // Dynamic Clock Setup
    function updateClock() {
      const now = new Date();
      const monthNames = ["January", "February", "March", "April", "May", "June", 
                          "July", "August", "September", "October", "November", "December"];
      
      const month = monthNames[now.getMonth()];
      const day = now.getDate();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;

      document.getElementById('clockDate').textContent = `${month} ${day}`;
      document.getElementById('clockTime').textContent = `${hours}:${minutes} ${ampm}`;
    }

    function updateLastUpdatedTimestamp() {
      const now = new Date();
      const monthNames = ["January", "February", "March", "April", "May", "June", 
                          "July", "August", "September", "October", "November", "December"];
      const month = monthNames[now.getMonth()];
      const day = now.getDate();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      
      document.getElementById('lastUpdated').textContent = `${month} ${day} | ${hours}:${minutes} ${ampm}`;
    }

    // Render Grid UI
    function renderGrid() {
      const container = document.getElementById('ballroomGrid');
      container.innerHTML = '';

      tablePairs.forEach(pair => {
        const topTable = pair[0];
        const botTable = pair[1];

        const card = document.createElement('div');
        card.className = 'table-pair-card';

        card.innerHTML = `
          <div class="table-pair-header">PAIR ${topTable.replace('table ', '')} / ${botTable.replace('table ', '')}</div>
          
          <div class="table-half">
            <div class="table-label">${topTable.toUpperCase()}</div>
            <div class="outlet-grid-4x4" id="grid-${topTable.replace(/\s+/g, '-')}"></div>
          </div>

          <div class="table-divider"></div>

          <div class="table-half">
            <div class="table-label">${botTable.toUpperCase()}</div>
            <div class="outlet-grid-4x4" id="grid-${botTable.replace(/\s+/g, '-')}"></div>
          </div>
        `;

        container.appendChild(card);

        renderTableOutlets(topTable);
        renderTableOutlets(botTable);
      });
    }

    function renderTableOutlets(tableName) {
      const gridElem = document.getElementById(`grid-${tableName.replace(/\s+/g, '-')}`);
      if (!gridElem) return;
      gridElem.innerHTML = '';

      const outlets = outletState[tableName] || Array(16).fill('available');

      outlets.forEach((status, idx) => {
        const cell = document.createElement('div');
        cell.className = `outlet-cell ${status}`;
        if (isAdmin && status === 'unpluggable') {
          cell.classList.add('admin-editable');
        }

        cell.title = `${tableName} - Outlet ${idx + 1}: ${status.toUpperCase()}`;
        cell.onclick = () => handleOutletClick(tableName, idx);

        gridElem.appendChild(cell);
      });
    }

    // Interactive Outlet Editing Logic
    function handleOutletClick(tableName, index) {
      const currentStatus = outletState[tableName][index];

      // Regular user cannot edit unpluggable/black outlets
      if (currentStatus === 'unpluggable' && !isAdmin) {
        alert('This outlet is marked as Unpluggable (Power Supply). Only an Administrator can edit it.');
        return;
      }

      // Cycle status logic:
      // Normal User: available <-> unavailable
      // Admin: available -> unavailable -> unpluggable -> available
      let nextStatus = currentStatus;

      if (!isAdmin) {
        nextStatus = currentStatus === 'available' ? 'unavailable' : 'available';
      } else {
        if (currentStatus === 'available') nextStatus = 'unavailable';
        else if (currentStatus === 'unavailable') nextStatus = 'unpluggable';
        else if (currentStatus === 'unpluggable') nextStatus = 'available';
      }

      outletState[tableName][index] = nextStatus;
      saveOutletState();
      renderTableOutlets(tableName);
    }

    // Admin Auth Logic
    function handleAdminToggle() {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtnText').textContent = 'Admin Login';
        document.getElementById('adminBtn').classList.remove('logged-in');
        renderGrid();
      } else {
        document.getElementById('adminModal').classList.add('active');
        document.getElementById('modalError').style.display = 'none';
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
    }

    function submitAdminLogin(event) {
      event.preventDefault();
      const name = document.getElementById('adminName').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const id = document.getElementById('adminId').value.trim();

      if (name === "Mr. Rev" && password === "Datathon" && id === "2026") {
        isAdmin = true;
        document.getElementById('adminBtnText').textContent = 'Admin Logout';
        document.getElementById('adminBtn').classList.add('logged-in');
        closeAdminModal();
        renderGrid();
        // Clear fields
        document.getElementById('adminName').value = '';
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminId').value = '';
      } else {
        document.getElementById('modalError').style.display = 'block';
      }
    }

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      initializeOutletState();
      renderGrid();
      updateClock();
      setInterval(updateClock, 1000);
    });
  </script>
</body>
</html>
